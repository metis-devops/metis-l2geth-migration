name: test

env:
  GOTOOLCHAIN: local

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          skip-cache: true
          install-only: true
      - run: make ci test-race

  cross-build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Build
        run: make build

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: ./internal/bundle
            fuzz: FuzzDecodeAccount
          - package: ./internal/bundle
            fuzz: FuzzRecordFraming
          - package: ./internal/strictio
            fuzz: FuzzStrictJSON
          - package: ./internal/migration
            fuzz: FuzzSemanticRecords
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Fuzz ${{ matrix.fuzz }}
        run: go test "${{ matrix.package }}" -run '^$' -fuzz '^${{ matrix.fuzz }}$' -fuzztime 30s

  image:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: l2state:test
          provenance: false
          sbom: false
          cache-from: type=gha,scope=smock-check-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=smock-check-${{ runner.os }}-${{ runner.arch }},ignore-error=true
      - name: Smock check
        run: docker run --rm l2state:test version
